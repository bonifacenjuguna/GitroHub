<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GitroHub — Connection Cancelled</title>
<style>
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 20%, #1a1f36 0%, #0d1117 55%, #05070d 100%);
    color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .card {
    max-width: 400px; padding: 40px 32px; text-align: center;
    background: rgba(22,27,34,0.75); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; backdrop-filter: blur(12px);
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 18px; margin-bottom: 10px; }
  p { color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔌</div>
    <h1>Connection cancelled</h1>
    <p>You cancelled the GitHub authorization, or it was denied. No changes were made — return to Telegram and try again whenever you're ready.</p>
  </div>
</body>
</html>
