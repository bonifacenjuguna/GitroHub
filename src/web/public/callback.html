<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GitroHub — Connecting your GitHub account</title>
<style>
  :root {
    --bg1: #0d1117;
    --bg2: #161b22;
    --accent1: #6e5bff;
    --accent2: #22d3ee;
    --success: #3fb950;
    --error: #f85149;
    --text: #e6edf3;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 30% 20%, #1a1f36 0%, var(--bg1) 55%, #05070d 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    width: 100%;
    max-width: 420px;
    padding: 40px 32px;
    background: rgba(22, 27, 34, 0.75);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(110,91,255,0.08);
    animation: cardIn 0.6s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .logo {
    font-size: 40px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 12px rgba(110,91,255,0.6));
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 28px;
  }

  /* --- Ring spinner --- */
  .ring-wrap { position: relative; width: 96px; height: 96px; margin: 0 auto 24px; }
  .ring {
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.08);
    border-top-color: var(--accent1);
    border-right-color: var(--accent2);
    animation: spin 1s linear infinite;
  }
  .ring-icon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- Success check --- */
  .check-wrap { display: none; width: 96px; height: 96px; margin: 0 auto 24px; align-items: center; justify-content: center; }
  .check-circle {
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle, rgba(63,185,80,0.25), transparent 70%);
    display: flex; align-items: center; justify-content: center;
    animation: popIn 0.5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes popIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .checkmark { font-size: 48px; color: var(--success); }

  .error-wrap { display: none; width: 96px; height: 96px; margin: 0 auto 24px; align-items: center; justify-content: center; }
  .error-circle {
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle, rgba(248,81,73,0.25), transparent 70%);
    display: flex; align-items: center; justify-content: center;
    animation: popIn 0.5s cubic-bezier(.2,1.4,.4,1);
  }
  .errormark { font-size: 44px; color: var(--error); }

  /* --- Steps --- */
  .steps { list-style: none; text-align: left; margin: 0 auto 24px; max-width: 280px; }
  .steps li {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0;
    color: var(--muted);
    font-size: 14px;
    opacity: 0.35;
    transition: opacity 0.35s ease, color 0.35s ease;
  }
  .steps li.active { opacity: 1; color: var(--text); }
  .steps li.done { opacity: 1; color: var(--success); }
  .steps li .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }
  .steps li.active .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.5; } }

  .status-text { font-size: 15px; color: var(--muted); margin-bottom: 20px; min-height: 20px; }
  .status-text.success { color: var(--success); font-weight: 600; }
  .status-text.error { color: var(--error); font-weight: 600; }

  .btn {
    display: none;
    text-decoration: none;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    color: #0a0e14;
    font-weight: 700;
    padding: 13px 28px;
    border-radius: 12px;
    font-size: 15px;
    box-shadow: 0 8px 24px rgba(110,91,255,0.35);
    transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }

  .countdown { font-size: 12px; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🐙</div>
    <h1>GitroHub</h1>

    <div class="ring-wrap" id="ringWrap">
      <div class="ring"></div>
      <div class="ring-icon">🔗</div>
    </div>

    <div class="check-wrap" id="checkWrap">
      <div class="check-circle"><span class="checkmark">✓</span></div>
    </div>

    <div class="error-wrap" id="errorWrap">
      <div class="error-circle"><span class="errormark">✕</span></div>
    </div>

    <ul class="steps" id="steps">
      <li id="step1"><span class="dot"></span> Validating request…</li>
      <li id="step2"><span class="dot"></span> Exchanging authorization code…</li>
      <li id="step3"><span class="dot"></span> Encrypting your access token…</li>
      <li id="step4"><span class="dot"></span> Finalizing connection…</li>
    </ul>

    <div class="status-text" id="statusText">Connecting your GitHub account…</div>

    <a class="btn" id="returnBtn" href="#">↩️ Return to Telegram</a>
    <div class="countdown" id="countdown"></div>
  </div>

<script>
  const SERVER_STATUS = "__STATUS__";
  const USERNAME = "__USERNAME__";
  const MESSAGE = "__MESSAGE__";
  const BOT_USERNAME = "__BOT_USERNAME__";

  const steps = ['step1', 'step2', 'step3', 'step4'];
  const statusText = document.getElementById('statusText');
  const ringWrap = document.getElementById('ringWrap');
  const checkWrap = document.getElementById('checkWrap');
  const errorWrap = document.getElementById('errorWrap');
  const returnBtn = document.getElementById('returnBtn');
  const countdown = document.getElementById('countdown');

  returnBtn.href = `https://t.me/${BOT_USERNAME}`;

  function markStep(index, state) {
    const el = document.getElementById(steps[index]);
    el.classList.remove('active', 'done');
    el.classList.add(state);
  }

  async function playSteps() {
    for (let i = 0; i < steps.length; i++) {
      markStep(i, 'active');
      await new Promise((r) => setTimeout(r, 420 + Math.random() * 220));
      markStep(i, 'done');
    }
  }

  async function finish() {
    await playSteps();

    if (SERVER_STATUS === 'success') {
      statusText.textContent = `Welcome, @${USERNAME}! Connected successfully.`;
      statusText.classList.add('success');
      ringWrap.style.display = 'none';
      checkWrap.style.display = 'flex';
      returnBtn.style.display = 'inline-block';

      let seconds = 4;
      countdown.textContent = `Redirecting to Telegram in ${seconds}s…`;
      const interval = setInterval(() => {
        seconds -= 1;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = returnBtn.href;
        } else {
          countdown.textContent = `Redirecting to Telegram in ${seconds}s…`;
        }
      }, 1000);
    } else {
      statusText.textContent = MESSAGE || 'Something went wrong connecting your account.';
      statusText.classList.add('error');
      ringWrap.style.display = 'none';
      errorWrap.style.display = 'flex';
      returnBtn.style.display = 'inline-block';
      returnBtn.textContent = '↩️ Back to Telegram';
    }
  }

  finish();
</script>
</body>
</html>
